<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IP & Device Info</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0f;--surface:#12121a;--border:#1e1e2e;--text:#c8c8d4;--muted:#6b6b80;--accent:#00d4ff;--green:#00ff41}
body{font-family:'JetBrains Mono','Fira Code',monospace;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.container{max-width:560px;width:100%}
.header{text-align:center;margin-bottom:28px}
.header h1{font-size:22px;color:#fff;letter-spacing:-0.5px}
.header h1 span{color:var(--accent)}
.header p{font-size:12px;color:var(--muted);margin-top:4px;letter-spacing:0.3px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:14px}
.card-title{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.04)}
.row:last-child{border-bottom:none}
.label{font-size:12px;color:var(--muted)}
.value{font-size:13px;color:#fff;text-align:right;word-break:break-all;max-width:60%}
.value.accent{color:var(--accent)}
.value.green{color:var(--green)}
.badge{display:inline-block;background:rgba(0,212,255,0.12);color:var(--accent);font-size:10px;padding:2px 8px;border-radius:4px;letter-spacing:0.3px;margin-left:6px}
.loading{text-align:center;padding:16px;color:var(--muted);font-size:12px}
.loading::after{content:'';display:inline-block;width:10px;height:10px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite;margin-left:6px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.error{color:#ff4757;font-size:12px;padding:8px;text-align:center}
.ip-large{font-size:28px;font-weight:700;color:#fff;text-align:center;padding:8px 0 4px;letter-spacing:-0.5px;font-family:'Inter',sans-serif}
.ip-sub{text-align:center;font-size:11px;color:var(--muted);margin-bottom:4px}
.copy-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:11px;padding:2px 6px;border-radius:4px;transition:.15s}
.copy-btn:hover{color:var(--accent);background:rgba(0,212,255,0.1)}
.copy-btn.copied{color:var(--green)}
.refresh-btn{display:block;margin:16px auto 0;background:var(--surface);border:1px solid var(--border);color:var(--muted);padding:8px 20px;border-radius:8px;cursor:pointer;font-size:12px;font-family:inherit;transition:.15s}
.refresh-btn:hover{border-color:var(--accent);color:var(--accent)}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>&#x25C8; <span>ip</span>/info</h1>
    <p>your public identity &amp; device fingerprint</p>
  </div>

  <div class="card">
    <div id="ip-loading" class="loading">Resolving</div>
    <div id="ip-content" style="display:none">
      <div class="ip-large" id="ip-address"></div>
      <div class="ip-sub"><span id="ip-isp"></span> <span id="ip-org" class="badge"></span></div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Geolocation</div>
    <div id="geo-loading" class="loading">Locating</div>
    <div id="geo-content" style="display:none">
      <div class="row"><span class="label">City</span><span class="value" id="geo-city">—</span></div>
      <div class="row"><span class="label">Region</span><span class="value" id="geo-region">—</span></div>
      <div class="row"><span class="label">Country</span><span class="value" id="geo-country">—</span></div>
      <div class="row"><span class="label">Coordinates</span><span class="value accent" id="geo-coords">—</span></div>
      <div class="row"><span class="label">Timezone</span><span class="value" id="geo-tz">—</span></div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Device &amp; Browser</div>
    <div class="row"><span class="label">Browser</span><span class="value" id="d-browser">—</span></div>
    <div class="row"><span class="label">OS</span><span class="value" id="d-os">—</span></div>
    <div class="row"><span class="label">Screen</span><span class="value" id="d-screen">—</span></div>
    <div class="row"><span class="label">Language</span><span class="value" id="d-lang">—</span></div>
    <div class="row"><span class="label">Platform</span><span class="value" id="d-platform">—</span></div>
    <div class="row"><span class="label">Battery</span><span class="value green" id="d-battery">—</span></div>
  </div>

  <div class="card">
    <div class="card-title">Connection</div>
    <div class="row"><span class="label">Connection</span><span class="value" id="c-type">—</span></div>
    <div class="row"><span class="label">RTT</span><span class="value accent" id="c-rtt">—</span></div>
    <div class="row"><span class="label">Data Saver</span><span class="value" id="c-saver">—</span></div>
  </div>

  <button class="refresh-btn" onclick="refreshAll()">⟳ Refresh</button>
</div>

<script>
async function getIP() {
  try {
    const r=await fetch('https://api.ipify.org?format=json');
    const d=await r.json();
    document.getElementById('ip-address').textContent=d.ip;
    document.getElementById('ip-loading').style.display='none';
    document.getElementById('ip-content').style.display='block';
    return d.ip;
  } catch(e){
    document.getElementById('ip-loading').innerHTML='<span class="error">Failed to resolve IP</span>';
    return null;
  }
}

async function getGeo(ip) {
  try {
    const r=await fetch('https://ipapi.co/'+ip+'/json/');
    if(!r.ok) throw new Error(r.status);
    const d=await r.json();
    document.getElementById('geo-city').textContent=d.city||'—';
    document.getElementById('geo-region').textContent=d.region||'—';
    document.getElementById('geo-country').textContent=d.country_name+' ('+d.country_code+')'||'—';
    document.getElementById('geo-coords').textContent=(d.latitude&&d.longitude)?d.latitude+', '+d.longitude:'—';
    document.getElementById('geo-tz').textContent=d.timezone||'—';
    document.getElementById('ip-isp').textContent=d.org||'';
    document.getElementById('geo-loading').style.display='none';
    document.getElementById('geo-content').style.display='block';
  } catch(e){
    document.getElementById('geo-loading').innerHTML='<span class="error">Geo lookup failed</span>';
  }
}

function getDevice() {
  const ua=navigator.userAgent;
  const browser=()=>{
    if(ua.includes('Firefox')) return 'Firefox';
    if(ua.includes('Edg')) return 'Edge';
    if(ua.includes('Chrome')) return 'Chrome';
    if(ua.includes('Safari')) return 'Safari';
    return 'Unknown';
  };
  const os=()=>{
    if(ua.includes('Android')) return 'Android';
    if(ua.includes('Linux')&&!ua.includes('Android')) return 'Linux';
    if(ua.includes('Windows')) return 'Windows';
    if(ua.includes('Mac OS')) return 'macOS';
    if(ua.includes('iOS')||ua.includes('iPhone')) return 'iOS';
    return 'Unknown';
  };
  document.getElementById('d-browser').textContent=browser()+' '+(navigator.userAgent.match(/(Chrome|Firefox|Edg|Safari)\/([\d.]+)/)?.[2]||'');
  document.getElementById('d-os').textContent=os();
  document.getElementById('d-screen').textContent=screen.width+'\u00d7'+screen.height+' ('+screen.colorDepth+'bit)';
  document.getElementById('d-lang').textContent=navigator.language||'—';
  document.getElementById('d-platform').textContent=navigator.platform||'—';
}

function getConnection() {
  const c=navigator.connection||navigator.mozConnection||navigator.webkitConnection;
  if(c){
    document.getElementById('c-type').textContent=(c.effectiveType||'unknown').toUpperCase();
    document.getElementById('c-rtt').textContent=c.rtt?c.rtt+'ms':'—';
    document.getElementById('c-saver').textContent=c.saveData?'ON':'OFF';
  } else {
    document.getElementById('c-type').textContent='—';
    document.getElementById('c-rtt').textContent='—';
    document.getElementById('c-saver').textContent='—';
  }
}

function getBattery() {
  if(navigator.getBattery){
    navigator.getBattery().then(b=>{
      document.getElementById('d-battery').textContent=Math.round(b.level*100)+'%'+(b.charging?' ⚡':'');
    }).catch(()=>{
      document.getElementById('d-battery').textContent='—';
    });
  } else {
    document.getElementById('d-battery').textContent='—';
  }
}

function refreshAll(){
  location.reload();
}

getDevice();
getConnection();
getBattery();
getIP().then(ip=>{if(ip) getGeo(ip)});
</script>
</body>
</html>
